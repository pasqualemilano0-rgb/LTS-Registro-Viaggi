name: Promemoria iPhone LTS
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iphone-reminders.yml'
permissions:
  id-token: write
concurrency:
  group: lts-iphone-reminders
  cancel-in-progress: false
jobs:
  invia:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Controlla e invia i promemoria autorizzati
        env:
          LTS_DISPATCH_URL: https://lts-registro-viaggi-iphone.steadyzebra1.chatgpt.site/api/push-dispatch
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.parse, urllib.request, urllib.error
          endpoint = os.environ['LTS_DISPATCH_URL']
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, next_url):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          def read_json(url, headers, data=None, timeout=35):
              request = urllib.request.Request(url, headers={'User-Agent': 'LTS-Reminder-Scheduler/1.0', **headers}, data=data)
              with opener.open(request, timeout=timeout) as response:
                  content = response.read(32769)
                  if len(content) > 32768 or response.status != 200:
                      raise RuntimeError('Risposta del servizio non valida.')
                  return json.loads(content)
          stage = 'identita GitHub'
          try:
              oidc_url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
              if not oidc_url.startswith('https://'):
                  raise RuntimeError('Identità del processo non disponibile.')
              oidc_url += ('&' if '?' in oidc_url else '?') + urllib.parse.urlencode({'audience': endpoint})
              token = read_json(oidc_url, {'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}, timeout=15)['value']
              if not isinstance(token, str) or len(token) > 16384:
                  raise RuntimeError('Identità del processo non valida.')
              stage = 'pianificatore LTS'
              cursor, started, pages = None, time.monotonic(), 0
              totals = {key: 0 for key in ('inspected','due','claimed','accepted','retry','failed','revoked','expired','skipped')}
              while True:
                  url = endpoint + (('?' + urllib.parse.urlencode({'cursor': cursor})) if cursor else '')
                  result = read_json(url, {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'}, b'{}')
                  pages += 1
                  for key in totals:
                      count = result.get(key, 0)
                      if not isinstance(count, int) or count < 0:
                          raise RuntimeError('Esito del pianificatore non valido.')
                      totals[key] += count
                  if not result.get('hasMore'):
                      break
                  next_cursor = result.get('cursor')
                  if not next_cursor or next_cursor == cursor or time.monotonic() - started > 140 or pages >= 100:
                      raise RuntimeError('Invio parziale: proseguirà dal prossimo controllo.')
                  cursor = next_cursor
              print(json.dumps({'ok': True, 'pages': pages, **totals}))
          except urllib.error.HTTPError as error:
              print('Controllo promemoria non completato: ' + stage + ', HTTP ' + str(error.code) + '.', file=sys.stderr)
              sys.exit(1)
          except Exception as error:
              print('Controllo promemoria non completato: ' + stage + ', ' + type(error).__name__ + '.', file=sys.stderr)
              sys.exit(1)
          PY
