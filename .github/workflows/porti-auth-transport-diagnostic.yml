name: Porti production auth transport diagnostic (read-only)
# Automatic equivalent: CircleCI booking-auth-transport on relevant changes.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Full read-only transport and live publication diagnostic
        run: bash scripts/qa-porti-auth-transport.sh
