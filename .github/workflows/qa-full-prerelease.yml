name: LTS RC — gate completo senza deploy

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lts-prerelease-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax-check all JavaScript modules
        run: |
          find . -type f -name '*.mjs' ! -path './node_modules/*' -print0 | xargs -0 -n 1 node --check
          node --check sw.js
      - name: Run every repository JavaScript test
        run: node --test tests/*.test.mjs
      - name: Run all Python regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify Porti publisher is validated, main-only and PR read-only
        run: node --test tests/qa-no-auto-publish.test.mjs
