name: QA release LTS Autisti — Fase 1
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/admin-records-core.mjs'
      - 'shared/admin-record-operations.mjs'
      - 'tests/admin-record-operations.test.mjs'
      - 'tests/qa-admin-records-live.test.mjs'
      - 'amministratore/**'
      - 'realtime-client.mjs'
      - 'supabase/migrations/**'
      - 'shared/company-extras.mjs'
      - 'supabase/functions/lts-company-tariffs/**'
      - 'supabase/functions/lts-driver-onboarding/**'
      - 'pro-theme.css'
      - 'index.html'
      - 'shell.html'
      - 'recupera-password.html'
      - 'tests/qa-pro-theme.test.mjs'
      - 'account-access.mjs'
      - 'runtime-config.mjs'
      - 'privacy/index.html'
      - 'tests/qa-company-report-release.test.mjs'
      - 'tests/qa-report-production-http-smoke.mjs'
      - 'tests/company-report-browser.mjs'
      - 'tests/control-center-browser.mjs'
      - 'tests/qa-control-center-model.test.mjs'
      - 'tests/qa-offline-worker-browser.mjs'
      - 'tests/qa-offline-store-browser.mjs'
      - 'tests/qa-trip-editor-safety.test.mjs'
      - 'shared/register-explorer.mjs'
      - 'tests/qa-register-explorer.test.mjs'
      - 'tests/qa-register-browser.mjs'
      - 'tests/report-export.test.mjs'
      - 'tests/qa-account-release.test.mjs'
      - 'tests/qa-release-versions.test.mjs'
      - 'tests/qa-regression-contract.test.mjs'
      - 'tests/qa-no-auto-publish.test.mjs'
      - 'tests/qa-driver-management-fixes.test.mjs'
      - '.github/workflows/qa-company-report-release.yml'
  push:
    branches: [main, release/lts-autisti-company-v1-20261104]
    paths:
      - 'server/admin-records-core.mjs'
      - 'shared/admin-record-operations.mjs'
      - 'tests/admin-record-operations.test.mjs'
      - 'tests/qa-admin-records-live.test.mjs'
      - 'amministratore/**'
      - 'realtime-client.mjs'
      - 'supabase/migrations/**'
      - 'shared/company-extras.mjs'
      - 'supabase/functions/lts-company-tariffs/**'
      - 'supabase/functions/lts-driver-onboarding/**'
      - 'pro-theme.css'
      - 'index.html'
      - 'shell.html'
      - 'recupera-password.html'
      - 'tests/qa-pro-theme.test.mjs'
      - 'account-access.mjs'
      - 'runtime-config.mjs'
      - 'tests/qa-company-report-release.test.mjs'
      - 'tests/qa-report-production-http-smoke.mjs'
      - 'tests/company-report-browser.mjs'
      - 'tests/control-center-browser.mjs'
      - 'tests/qa-control-center-model.test.mjs'
      - 'tests/qa-offline-worker-browser.mjs'
      - 'tests/qa-offline-store-browser.mjs'
      - 'tests/qa-trip-editor-safety.test.mjs'
      - 'shared/register-explorer.mjs'
      - 'tests/qa-register-explorer.test.mjs'
      - 'tests/qa-register-browser.mjs'
      - 'tests/qa-pro-theme.test.mjs'
      - 'tests/qa-driver-management-fixes.test.mjs'
      - '.github/workflows/qa-company-report-release.yml'
permissions:
  contents: read
jobs:
  public-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check amministratore/report.mjs
          node --check amministratore/report-insights.mjs
          node --check amministratore/report-export.mjs
          node --check amministratore/admin.mjs
          node --check amministratore/control-center-home.mjs
          node --check amministratore/control-center-model.mjs
          node --check amministratore/company-manual-registration.mjs
          node --check supabase/functions/lts-shared-maps/maps-registry-handler.mjs
          node --check realtime-client.mjs
          node --check supabase/functions/lts-driver-onboarding/core.mjs
          node --check account-access.mjs
          node --check shared/admin-record-operations.mjs
          node --check server/admin-records-core.mjs
          node --check amministratore/driver-records.mjs
          node --check amministratore/driver-customer-catalog.mjs
          node --check amministratore/company-extras.mjs
          node --check shared/company-extras.mjs
          node --check supabase/functions/lts-company-tariffs/tariff-handler.mjs
          node --check tests/company-report-browser.mjs
          node --check tests/control-center-browser.mjs
          node --test tests/qa-control-center-model.test.mjs
          node --check tests/qa-register-browser.mjs
          node --check tests/qa-report-production-http-smoke.mjs
          node --test tests/admin-record-operations.test.mjs
          node --test tests/qa-driver-management-fixes.test.mjs tests/qa-manual-customers.test.mjs tests/qa-realtime.test.mjs tests/qa-company-report-release.test.mjs tests/qa-pro-theme.test.mjs tests/qa-account-release.test.mjs tests/qa-trip-editor-safety.test.mjs tests/qa-register-explorer.test.mjs tests/driver-session-vault.test.mjs tests/leaked-password-protection.test.mjs tests/report-export.test.mjs tests/qa-release-versions.test.mjs tests/qa-regression-contract.test.mjs tests/qa-no-auto-publish.test.mjs
  production-endpoint-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Live no-credentials production report smoke
        run: node tests/qa-report-production-http-smoke.mjs

  chromium-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/lts-playwright"
          npm install --prefix "$RUNNER_TEMP/lts-playwright" --no-save --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/lts-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Mobile dashboard flow with synthetic mock records
        run: LTS_BROWSER_PLAYWRIGHT="$RUNNER_TEMP/lts-playwright" node tests/company-report-browser.mjs

      - name: Control Center verified KPI, filters, lifecycle and isolation in Chromium
        run: LTS_BROWSER_PLAYWRIGHT="$RUNNER_TEMP/lts-playwright" LTS_CONTROL_REPORT="$RUNNER_TEMP/control-center-chromium.json" node tests/control-center-browser.mjs

      - name: Preserve synthetic Control Center Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-center-chromium
          path: ${{ runner.temp }}/control-center-chromium.json
          if-no-files-found: warn

      - name: 390px mobile Register V4 search, filters, pagination and undo
        run: LTS_BROWSER_PLAYWRIGHT="$RUNNER_TEMP/lts-playwright" node tests/qa-register-browser.mjs

      - name: PWA offline Chromium cache and private API regression
        run: LTS_BROWSER_PLAYWRIGHT="$RUNNER_TEMP/lts-playwright" node tests/qa-offline-worker-browser.mjs

      - name: Installable administrator PWA in Chromium (scope, offline protection)
        run: LTS_BROWSER_PLAYWRIGHT="$RUNNER_TEMP/lts-playwright" node tests/qa-admin-installable-browser.mjs

      - name: IndexedDB offline edits and outbox replay in Chromium
        run: LTS_BROWSER_PLAYWRIGHT="$RUNNER_TEMP/lts-playwright" node tests/qa-offline-store-browser.mjs

      - name: Verify live protected driver records API
        run: node --test tests/qa-admin-records-live.test.mjs


  webkit-safari:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Safari WebKit
        run: |
          mkdir -p "$RUNNER_TEMP/lts-playwright"
          npm install --prefix "$RUNNER_TEMP/lts-playwright" --no-save --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/lts-playwright/node_modules/.bin/playwright" install --with-deps webkit
      - name: Safari WebKit mobile admin, certifies Maps and restores archived customer
        run: LTS_BROWSER_PLAYWRIGHT="$RUNNER_TEMP/lts-playwright" LTS_BROWSER_ENGINE=webkit node tests/company-report-browser.mjs
      - name: Control Center verified KPI, filters, lifecycle and isolation in Safari WebKit
        run: LTS_BROWSER_PLAYWRIGHT="$RUNNER_TEMP/lts-playwright" LTS_BROWSER_ENGINE=webkit LTS_CONTROL_REPORT="$RUNNER_TEMP/control-center-webkit.json" node tests/control-center-browser.mjs
      - name: Preserve synthetic Control Center Safari WebKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-center-webkit
          path: ${{ runner.temp }}/control-center-webkit.json
          if-no-files-found: warn
      - name: 390px Safari Register V4 search, filters, pagination and undo
        run: LTS_BROWSER_PLAYWRIGHT="$RUNNER_TEMP/lts-playwright" LTS_BROWSER_ENGINE=webkit node tests/qa-register-browser.mjs
      - name: Safari WebKit offline IndexedDB and outbox consistency
        run: LTS_BROWSER_PLAYWRIGHT="$RUNNER_TEMP/lts-playwright" LTS_BROWSER_ENGINE=webkit node tests/qa-offline-store-browser.mjs
