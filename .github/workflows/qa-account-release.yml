name: QA release account Supabase LTS
on:
  pull_request:
    branches: [main]
    paths:
      - 'account-access.mjs'
      - 'driver-session-vault.mjs'
      - 'recupera-password.mjs'
      - 'recupera-password.html'
      - 'client-store.mjs'
      - 'app.mjs'
      - 'shared/company-fares.mjs'
      - 'shared/customer-site-matches.mjs'
      - 'shared-maps-client.mjs'
      - 'tests/customer-site-matches.test.mjs'
      - 'shared/domain.mjs'
      - 'tests/qa-company-tariffs.test.mjs'
      - 'amministratore/**'
      - 'app.css'
      - 'runtime-config.mjs'
      - 'sw.js'
      - 'shell.html'
      - 'index.html'
      - 'tests/qa-account-release.test.mjs'
      - 'tests/leaked-password-protection.test.mjs'
      - '.github/workflows/qa-account-release.yml'
  push:
    branches: [main]
    paths:
      - 'account-access.mjs'
      - 'driver-session-vault.mjs'
      - 'recupera-password.mjs'
      - 'recupera-password.html'
      - 'client-store.mjs'
      - 'app.mjs'
      - 'shared/company-fares.mjs'
      - 'shared/customer-site-matches.mjs'
      - 'shared-maps-client.mjs'
      - 'tests/customer-site-matches.test.mjs'
      - 'shared/domain.mjs'
      - 'tests/qa-company-tariffs.test.mjs'
      - 'amministratore/**'
      - 'app.css'
      - 'runtime-config.mjs'
      - 'sw.js'
      - 'shell.html'
      - 'index.html'
      - 'tests/qa-account-release.test.mjs'
      - 'tests/leaked-password-protection.test.mjs'
permissions:
  contents: read
jobs:
  verify-account-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static JS syntax and safety assertions
        run: |
          node --check app.mjs
          node --check shared/company-fares.mjs
          node --check shared/customer-site-matches.mjs
          node --check shared/domain.mjs
          node --check client-store.mjs
          node --check account-access.mjs
          node --check driver-session-vault.mjs
          node --check recupera-password.mjs
          node --check sw.js
          node --test tests/qa-account-release.test.mjs tests/driver-session-vault.test.mjs tests/leaked-password-protection.test.mjs tests/qa-company-tariffs.test.mjs tests/customer-site-matches.test.mjs
