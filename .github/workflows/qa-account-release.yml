name: QA release account Supabase LTS
on:
  pull_request:
    branches: [main]
    paths:
      - 'account-access.mjs'
      - 'driver-session-vault.mjs'
      - 'recupera-password.mjs'
      - 'recupera-password.html'
      - 'client-store.mjs'
      - 'app.mjs'
      - 'shared/company-fares.mjs'
      - 'shared/company-extras.mjs'
      - 'supabase/functions/lts-company-tariffs/**'
      - 'supabase/functions/lts-driver-onboarding/**'
      - 'supabase/migrations/**'
      - 'shared/customer-site-matches.mjs'
      - 'shared-maps-client.mjs'
      - 'tests/customer-site-matches.test.mjs'
      - 'tests/admin-record-operations.test.mjs'
      - 'shared/domain.mjs'
      - 'tests/qa-company-tariffs.test.mjs'
      - 'server/admin-records-core.mjs'
      - 'shared/admin-record-operations.mjs'
      - 'tests/admin-record-operations.test.mjs'
      - 'tests/qa-admin-records-live.test.mjs'
      - 'amministratore/**'
      - 'app.css'
      - 'runtime-config.mjs'
      - 'realtime-client.mjs'
      - 'supabase/migrations/**'
      - 'sw.js'
      - 'shell.html'
      - 'index.html'
      - 'tests/maps-redirect-diagnostic.mjs'
      - 'tests/qa-maps-reader-live.test.mjs'
      - 'tests/qa-account-release.test.mjs'
      - 'tests/qa-driver-management-fixes.test.mjs'
      - 'tests/leaked-password-protection.test.mjs'
      - '.github/workflows/qa-account-release.yml'
  push:
    branches: [main]
    paths:
      - 'account-access.mjs'
      - 'driver-session-vault.mjs'
      - 'recupera-password.mjs'
      - 'recupera-password.html'
      - 'client-store.mjs'
      - 'app.mjs'
      - 'shared/company-fares.mjs'
      - 'shared/company-extras.mjs'
      - 'supabase/functions/lts-company-tariffs/**'
      - 'supabase/functions/lts-driver-onboarding/**'
      - 'supabase/migrations/**'
      - 'shared/customer-site-matches.mjs'
      - 'shared-maps-client.mjs'
      - 'tests/customer-site-matches.test.mjs'
      - 'shared/domain.mjs'
      - 'tests/qa-company-tariffs.test.mjs'
      - 'server/admin-records-core.mjs'
      - 'shared/admin-record-operations.mjs'
      - 'tests/admin-record-operations.test.mjs'
      - 'tests/qa-admin-records-live.test.mjs'
      - 'amministratore/**'
      - 'app.css'
      - 'runtime-config.mjs'
      - 'realtime-client.mjs'
      - 'supabase/migrations/**'
      - 'sw.js'
      - 'shell.html'
      - 'index.html'
      - 'tests/maps-redirect-diagnostic.mjs'
      - 'tests/qa-maps-reader-live.test.mjs'
      - 'tests/qa-account-release.test.mjs'
      - 'tests/qa-driver-management-fixes.test.mjs'
      - 'tests/leaked-password-protection.test.mjs'
permissions:
  contents: read
jobs:
  verify-account-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static JS syntax and safety assertions
        run: |
          node --check app.mjs
          node --check realtime-client.mjs
          node --check supabase/functions/lts-driver-onboarding/core.mjs
          node --check supabase/functions/lts-shared-maps/maps-registry-handler.mjs
          node --check shared/company-fares.mjs
          node --check shared/company-extras.mjs
          node --check supabase/functions/lts-company-tariffs/tariff-handler.mjs
          node --check shared/customer-site-matches.mjs
          node --check shared/domain.mjs
          node --check client-store.mjs
          node --check account-access.mjs
          node --check shared/admin-record-operations.mjs
          node --check server/admin-records-core.mjs
          node --check amministratore/driver-records.mjs
          node --check driver-session-vault.mjs
          node --check recupera-password.mjs
          node --check sw.js
          node --test tests/qa-driver-management-fixes.test.mjs tests/qa-manual-customers.test.mjs tests/qa-realtime.test.mjs tests/qa-account-release.test.mjs tests/driver-session-vault.test.mjs tests/leaked-password-protection.test.mjs tests/qa-company-tariffs.test.mjs tests/customer-site-matches.test.mjs
      - name: Verify live protected driver records API
        run: node --test tests/qa-admin-records-live.test.mjs
      - name: Verify live Maps reader CORS and authentication boundary
        run: node --test tests/qa-maps-reader-live.test.mjs
      - name: Verify canonical Google Maps place from shortlink fixture
        run: node tests/maps-redirect-diagnostic.mjs
