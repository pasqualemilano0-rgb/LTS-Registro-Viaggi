name: LTS Porti — pubblica snapshot navi verificati da Cloudflare

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/refresh_porti_from_worker.py'
      - 'tests/test_refresh_porti_from_worker.py'
      - 'scripts/check_public_snapshot_freshness.py'
      - 'tests/test_public_snapshot_freshness.py'
      - '.github/workflows/refresh-lts-porti-snapshots.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_porti_from_worker.py'
      - 'tests/test_refresh_porti_from_worker.py'
      - 'scripts/check_public_snapshot_freshness.py'
      - 'tests/test_public_snapshot_freshness.py'
      - '.github/workflows/refresh-lts-porti-snapshots.yml'
  workflow_dispatch:
  schedule:
    # Due aggiornamenti della copia GitHub al giorno (lun-sab UTC).
    # Il Worker Cloudflare continua ad aggiornare autonomamente ogni 15 minuti.
    - cron: '38 6,18 * * 1-6'

permissions:
  contents: read

concurrency:
  group: lts-public-snapshot-refresh
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and offline fail-closed regression tests
        run: |
          python -m py_compile scripts/refresh_porti_from_worker.py tests/test_refresh_porti_from_worker.py scripts/check_public_snapshot_freshness.py tests/test_public_snapshot_freshness.py
          python -m unittest discover -s tests -p 'test_refresh_porti_from_worker.py' -v
          python -m unittest discover -s tests -p 'test_public_snapshot_freshness.py' -v


  prepare-snapshot-candidate:
    # Write only vetted PUBLIC schedules. Never run for PR code or source pushes.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # GITHUB_TOKEN is scoped to this schedule/manual job only; PR job remains read-only.
          persist-credentials: true
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare candidate snapshots from Cloudflare, without committing
        run: |
          python scripts/refresh_porti_from_worker.py
          git diff --check -- porti/data/conateco.json porti/data/tfg_schedule.json porti/data/sct.json
      - name: Fail closed if a candidate snapshot is stale
        run: python scripts/check_public_snapshot_freshness.py
      - name: Save verified snapshots for QA
        uses: actions/upload-artifact@v4
        with:
          name: lts-porti-snapshot-verified
          path: |
            porti/data/conateco.json
            porti/data/tfg_schedule.json
            porti/data/sct.json
          retention-days: 7
      - name: Publish only fresh and validated public vessel snapshots
        # The checkout above uses main; no PR data, booking, credentials or user content.
        # A GITHUB_TOKEN push will not trigger another Pages build; the UI reads
        # these fallback snapshots from the public raw.githubusercontent.com main URL.
        if: github.ref == 'refs/heads/main'
        run: |
          git add -- porti/data/conateco.json porti/data/tfg_schedule.json porti/data/sct.json
          if git diff --cached --quiet; then
            echo 'All three public snapshots already match; no commit needed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data(porti): refresh verified vessel schedules'
            git push origin HEAD:main
          fi
