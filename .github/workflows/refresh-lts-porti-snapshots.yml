name: LTS Porti — aggiorna snapshot pubblici dal monitor Cloudflare

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/refresh_porti_from_worker.py'
      - 'tests/test_refresh_porti_from_worker.py'
      - 'scripts/check_public_snapshot_freshness.py'
      - 'tests/test_public_snapshot_freshness.py'
      - '.github/workflows/refresh-lts-porti-snapshots.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_porti_from_worker.py'
      - 'tests/test_refresh_porti_from_worker.py'
      - 'scripts/check_public_snapshot_freshness.py'
      - 'tests/test_public_snapshot_freshness.py'
      - '.github/workflows/refresh-lts-porti-snapshots.yml'
  workflow_dispatch:
  schedule:
    # Dal lunedi al sabato (UTC): snapshot non pubblicati; nessuna acquisizione domenicale.
    # L'acquisizione Cloudflare resta indipendente; niente pubblicazione automatica.
    - cron: '38 5 * * 1-6'

permissions:
  contents: read

concurrency:
  group: lts-public-snapshot-refresh
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and offline fail-closed regression tests
        run: |
          python -m py_compile scripts/refresh_porti_from_worker.py tests/test_refresh_porti_from_worker.py scripts/check_public_snapshot_freshness.py tests/test_public_snapshot_freshness.py
          python -m unittest discover -s tests -p 'test_refresh_porti_from_worker.py' -v
          python -m unittest discover -s tests -p 'test_public_snapshot_freshness.py' -v


  prepare-snapshot-candidate:
    # Never publish directly from a scheduled run. Production release is separate.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare candidate snapshots from Cloudflare, without committing
        run: |
          python scripts/refresh_porti_from_worker.py
          git diff --check -- porti/data/conateco.json porti/data/tfg_schedule.json porti/data/sct.json
      - name: Fail closed if a candidate snapshot is stale
        run: python scripts/check_public_snapshot_freshness.py
      - name: Save unpublished snapshots for QA
        uses: actions/upload-artifact@v4
        with:
          name: lts-porti-snapshot-unpublished
          path: |
            porti/data/conateco.json
            porti/data/tfg_schedule.json
            porti/data/sct.json
          retention-days: 7
