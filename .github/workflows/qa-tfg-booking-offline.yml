name: QA TFG Booking offline diagnostics
on:
  pull_request:
    paths:
      - 'account-access.mjs'
      - 'tests/qa-tfg-auth-transport-stage.test.mjs'
      - 'driver-session-vault.mjs'
      - 'tests/qa-driver-refresh-vault-freshness.test.mjs'
      - 'tests/qa-tfg-auth-network-session-retry.test.mjs'
      - 'porti/app.js'
      - 'porti/tfg_booking.mjs'
      - 'tests/qa-tfg-booking-stage-diagnostics.test.mjs'
      - 'tests/qa-tfg-booking-offline-diagnostics.test.mjs'
      - '.github/workflows/qa-tfg-booking-offline.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check account-access.mjs
      - run: node --test tests/qa-tfg-auth-transport-stage.test.mjs
      - run: node --check driver-session-vault.mjs
      - run: node --test tests/qa-driver-refresh-vault-freshness.test.mjs
      - run: node --test tests/qa-tfg-auth-network-session-retry.test.mjs
      - run: node --check porti/app.js
      - run: node --check porti/tfg_booking.mjs
      - run: node --test tests/qa-tfg-booking-stage-diagnostics.test.mjs
      - run: node --test tests/qa-tfg-booking-offline-diagnostics.test.mjs
