 <linearGradient id="truckwhite" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#ffffff"/><stop offset=".48" stop-color="#eff6fa"/><stop offset="1" stop-color="#a6bccd"/></linearGradient>
